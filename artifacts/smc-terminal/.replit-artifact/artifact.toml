kind = "web"
previewPath = "/smc"
title = "SMC Terminal"
version = "1.0.0"
id = "artifacts/smc-terminal"
router = "path"

[[services]]
name = "smc-terminal"
paths = ["/smc"]
localPort = 5000

[services.development]
run = "bash /home/runner/workspace/artifacts/smc-terminal/start.sh"

[services.production]
run = "bash /home/runner/workspace/artifacts/smc-terminal/start.sh"
deploymentTarget = "vm"

[services.env]
PORT = "5000"
BASE_PATH = "/smc"
