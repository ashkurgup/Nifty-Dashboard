<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            padding: 24px 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: #38bdf8;
            border-radius: 16px;
            margin-bottom: 14px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .brand-sub {
            font-size: 11px;
            color: #64748b;
            font-weight: 400;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 360px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            display: block;
        }

        .input {
            display: block;
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #f8fafc;
            color: #0f172a;
            font-size: 18px;
            font-family: 'Lato', sans-serif;
            outline: none;
            margin-bottom: 18px;
            -webkit-appearance: none;
            appearance: none;
        }

        .input::placeholder {
            color: #94a3b8;
            font-size: 14px;
        }

        .input:focus {
            border-color: #38bdf8;
            background: #ffffff;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            letter-spacing: 1.5px;
            font-family: 'Lato', sans-serif;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn:active { background: #0ea5e9; }

        .error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f87171;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .footer-hint {
            margin-top: 24px;
            text-align: center;
            font-size: 10px;
            color: #1e293b;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="brand">
        <div class="brand-badge">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
                <path d="M3 3v18h18V3H3zm2 2h14v14H5V5zm2 9 3-4 3 3 2-3 3 4H7z"/>
            </svg>
        </div>
        <div class="brand-name">SMC TERMINAL</div>
        <div class="brand-sub">Live Trading Dashboard</div>
    </div>

    <div class="card">

        <div class="card-title">Secure Access</div>

        {% if error %}
        <div class="error">Incorrect password. Try again.</div>
        {% endif %}

        <form method="POST" autocomplete="on">

            <label class="input-label" for="pw">PASSWORD</label>

            <input
                id="pw"
                type="password"
                name="password"
                placeholder="Enter your password"
                class="input"
                autocomplete="current-password"
            >

            <button type="submit" class="btn">UNLOCK</button>

        </form>

    </div>

    <div class="footer-hint">PRIVATE · AUTHORISED ACCESS ONLY</div>

</body>

</html>
