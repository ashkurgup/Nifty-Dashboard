<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SMC Gate</title>

    <style>

        body {
            margin: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 280px;
            box-sizing: border-box;
        }

        .title {
            margin-top: 0;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #38bdf8;
            color: white;
            border: none;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <form method="POST" class="login-box">

        <h2 class="title">
            SMC Gate
        </h2>

        <input
            type="password"
            name="password"
            placeholder="Password"
            class="input"
        >

        <button type="submit" class="btn">
            UNLOCK
        </button>

    </form>

</body>

</html>
