<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            padding: 24px 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: #38bdf8;
            border-radius: 14px;
            margin-bottom: 14px;
        }

        .brand-badge svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 900;
            color: white;
            letter-spacing: 1px;
        }

        .brand-sub {
            font-size: 11px;
            color: #64748b;
            font-weight: 400;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 360px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
        }

        .input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 16px;
            font-family: 'Lato', sans-serif;
            outline: none;
            transition: border-color 0.15s;
        }

        .input::placeholder { color: #475569; }

        .input:focus { border-color: #38bdf8; }

        .btn {
            width: 100%;
            padding: 15px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            letter-spacing: 1.5px;
            font-family: 'Lato', sans-serif;
            transition: background 0.15s;
        }

        .btn:active { background: #0ea5e9; }

        .error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            padding: 10px 12px;
            color: #f87171;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .footer-hint {
            margin-top: 20px;
            text-align: center;
            font-size: 10px;
            color: #334155;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="brand">
        <div class="brand-badge">
            <!-- chart/terminal icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3v18h18V3H3zm2 2h14v14H5V5zm2 9l3-4 3 3 2-3 3 4H7z"/>
            </svg>
        </div>
        <div class="brand-name">SMC TERMINAL</div>
        <div class="brand-sub">Live Trading Dashboard</div>
    </div>

    <div class="card">

        <div class="card-title">Secure Access</div>

        {% if error %}
        <div class="error">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#f87171">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            Incorrect password
        </div>
        {% endif %}

        <form method="POST">

            <div class="input-wrap">
                <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    class="input"
                    autocomplete="current-password"
                    autofocus
                >
            </div>

            <button type="submit" class="btn">UNLOCK</button>

        </form>

    </div>

    <div class="footer-hint">PRIVATE · AUTHORISED ACCESS ONLY</div>

</body>

</html>
