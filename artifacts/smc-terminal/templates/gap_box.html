<style>
    .gb-wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        box-sizing: border-box;
        gap: 2px;
    }

    .gb-label {
        font-size: 9px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-family: 'Lato', sans-serif;
        line-height: 1;
    }

    .gb-pts {
        font-size: 16px;
        font-weight: 900;
        font-family: 'Lato', sans-serif;
        line-height: 1.1;
        white-space: nowrap;
    }

    .gb-status {
        font-size: 10px;
        font-weight: 600;
        color: #64748b;
        font-family: 'Lato', sans-serif;
        line-height: 1.1;
        white-space: nowrap;
    }

    .gb-bull { color: #16a34a; }
    .gb-bear { color: #dc2626; }
    .gb-dim  { color: #94a3b8; }

    .gap-box-card.gb-dir-bull { background: #f0fdf4; border-color: #86efac; }
    .gap-box-card.gb-dir-bear { background: #fef2f2; border-color: #fca5a5; }
</style>

<div class="gb-wrap">
    <span class="gb-label">Gap</span>
    <span class="gb-pts"   id="gb-pts"><span class="gb-dim">--</span></span>
    <span class="gb-status" id="gb-status"></span>
</div>

<script>
(() => {
const _GB_BASE = "{{ BASE_PATH }}";

async function loadGap() {
    try {
        const res = await fetch(_GB_BASE + '/core/market_context');
        const d   = await res.json();
        const card = document.querySelector('.gap-box-card');
        const pts  = document.getElementById('gb-pts');
        const sta  = document.getElementById('gb-status');
        if (!pts) return;

        if (!d.gap || d.gap === 'No') {
            pts.innerHTML  = `<span class="gb-dim">No Gap</span>`;
            sta.textContent = '';
            if (card) card.className = 'card gap-box-card';
        } else {
            const bull = d.gap_dir === 'Bullish';
            const sign = bull ? '+' : '';
            const cls  = bull ? 'gb-bull' : 'gb-bear';
            pts.innerHTML   = `<span class="${cls}">${sign}${d.gap_val} pts</span>`;
            sta.textContent = d.gap_closed ? `Close - ${d.gap_close_time}` : 'Open';
            if (card) card.className = `card gap-box-card ${bull ? 'gb-dir-bull' : 'gb-dir-bear'}`;
        }
    } catch(e) { console.error('[Gap box]', e); }
}

document.addEventListener('DOMContentLoaded', () => {
    loadGap();
    setInterval(loadGap, 30000);
});
})();
</script>
