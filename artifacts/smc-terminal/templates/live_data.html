<style>
    .nifty-pad {
        padding: 10px 16px;
        background: #ffffff;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    .n-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .n-title {
        font-size: 11px;
        font-weight: 800;
        color: #1e293b;
        letter-spacing: 0.5px;
    }

    .status-blip {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #94a3b8;
    }

    .blip-live {
        background-color: #10b981;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
        70%  { transform: scale(1);    box-shadow: 0 0 0 6px rgba(16,185,129,0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .n-price {
        font-size: 24px;
        font-weight: 900;
        margin-top: 6px;
        color: #0f172a;
        line-height: 1.1;
    }

    .n-change {
        font-size: 13px;
        font-weight: 700;
        margin-top: 7px;
        margin-bottom: 10px;
    }

    .n-spacer { flex: 1; }

    .n-hl-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        flex-shrink: 0;
    }

    .txt-h { color: #10b981; font-weight: 900; }
    .txt-l { color: #ef4444; font-weight: 900; }

    .n-footer {
        padding-top: 5px;
        border-top: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .n-ts {
        font-size: 10px;
        font-weight: 700;
    }
</style>

<div class="nifty-pad">

    <div class="n-top">
        <span class="n-title">NIFTY 50</span>
        <div id="status-blip" class="status-blip"></div>
    </div>

    <div class="n-price" id="n-price">--</div>

    <div class="n-change" id="n-change">-- (--%)</div>

    <div class="n-spacer"></div>

    <div class="n-hl-row">
        <span>H: <span id="n-high" class="txt-h">--</span></span>
        <span>L: <span id="n-low"  class="txt-l">--</span></span>
    </div>

    <div class="n-footer">
        <span style="font-size:10px;font-weight:800;color:#94a3b8;">LAST TICK</span>
        <span class="n-ts" id="n-ts">--</span>
    </div>

</div>

<script>
(() => {

    if (window.__liveDataInit) return;
    window.__liveDataInit = true;

    async function safeFetch(url) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch (err) {
            console.error("[LIVE DATA]", err);
            return null;
        }
    }

    const _liveBase = "{{ BASE_PATH }}";

    async function updateCard() {

        const blip = document.getElementById("status-blip");
        blip.className = "status-blip";   // always reset first — prevents stuck-green on fetch failure

        const data = await safeFetch(_liveBase + "/core/nifty_card");
        if (!data || !data.lp) return;

        document.getElementById("n-price").innerText =
            Number(data.lp).toLocaleString('en-IN', { minimumFractionDigits: 2 });

        document.getElementById("n-high").innerText =
            Number(data.high || data.lp).toFixed(2);

        document.getElementById("n-low").innerText =
            Number(data.low || data.lp).toFixed(2);

        const changeEl = document.getElementById("n-change");
        changeEl.innerText =
            `${data.change >= 0 ? '+' : ''}${data.change}  (${data.p_change}%)`;
        changeEl.style.color = data.change >= 0 ? "#10b981" : "#ef4444";

        const tsEl  = document.getElementById("n-ts");
        if (data.market === "CLOSED") {
            tsEl.innerText  = `${data.ts} (IDLE)`;
            tsEl.style.color = "#64748b";
            return;
        }

        tsEl.innerText  = data.ts;
        tsEl.style.color = "#10b981";
        blip.classList.add("blip-live");
    }

    window._boxGuard('live-data', updateCard);
    setInterval(function () { window._boxGuard('live-data', updateCard); }, 1000);

})();
</script>
