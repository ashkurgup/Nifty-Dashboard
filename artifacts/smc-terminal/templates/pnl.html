<style>
    .pnl-box {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: center;
    }

    .p-row {
        border-bottom: 1px solid #f1f5f9;
        padding-bottom: 8px;
    }

    .p-main {
        display: block;
        font-weight: 900;
        font-size: 16px;
        margin-bottom: 2px;
    }

    .p-sub {
        font-size: 10px;
        color: #94a3b8;
        margin-top: 2px;
        font-weight: 700;
    }

    .pnl-pos { color: #16a34a !important; }
    .pnl-neg { color: #dc2626 !important; }

    .txt-green {
        color: #16a34a !important;
        font-weight: 800;
    }

    .txt-red {
        color: #dc2626 !important;
        font-weight: 800;
    }

    .blocks {
        display: flex;
        gap: 4px;
        margin: 6px 0;
        justify-content: center;
    }

    .block {
        flex: 1;
        height: 18px;
        border-radius: 4px;
        font-size: 10px;
        text-align: center;
        color: white;
        line-height: 18px;
        font-weight: 800;
    }

    .bg-red { background: #ef4444; }
    .bg-green { background: #22c55e; }
    .bg-neutral { background: #cbd5e1; }
</style>

<div class="pnl-box">

    <div class="p-row">

        <div class="p-main" id="day-pnl">
            ₹0
        </div>

        <div class="p-sub">
            Active:
            <span id="act">0</span>

            |

            Total:
            <span id="tot">0</span>

            |

            Win:
            <span id="wr">0%</span>
        </div>

    </div>

    <div class="p-row">

        <div class="p-main" style="font-size:14px;" id="mon-pnl">
            ₹0
        </div>

        <div class="p-sub">

            Win:
            <span id="avg-w">0%</span>

            |

            HW:
            <span id="hw">0</span>

            |

            HL:
            <span id="hl">0</span>

            |

            TS:
            <span id="ts-score">0</span>

            |

            <span id="emo-pnl" style="color:#94a3b8;">₹0</span>

        </div>

    </div>

    <div class="p-row" style="border:none;">

        <div class="p-sub" style="color:#1e293b;margin-bottom:8px;">

            Rec:
            <span id="rec-val" style="color:#dc2626;">0k</span>

            |

            Cap:
            <span id="cap-val" class="txt-green">0k</span>

            |

            Gd Trades:
            <span id="gt" class="txt-green">0</span>

        </div>

        <div class="blocks" id="month-blocks"></div>

    </div>

</div>

<script>
(() => {

    if (window.__pnlInit) return;
    window.__pnlInit = true;

    const MANUAL_HISTORY = {
        "2026-02": "red",
        "2026-03": "red",
        "2026-04": "green"
    };

    const INITIAL_RECOVERY = 700000;
    const STARTING_CAPITAL = 50000;
    const TARGET_PER_TRADE = 2200;

    function updateMonthBlocks(allTrades) {

        const container = document.getElementById('month-blocks');

        const monthNames = [
            "JAN","FEB","MAR","APR",
            "MAY","JUN","JUL","AUG",
            "SEP","OCT","NOV","DEC"
        ];

        const now = new Date();

        let html = '';

        for (let i = 3; i > 0; i--) {

            const d = new Date(
                now.getFullYear(),
                now.getMonth() - i,
                1
            );

            const name = monthNames[d.getMonth()];

            const ym =
                `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

            let colorClass = 'bg-neutral';

            if (MANUAL_HISTORY[ym]) {

                colorClass =
                    MANUAL_HISTORY[ym] === 'green'
                        ? 'bg-green'
                        : 'bg-red';

            } else {

                const monthTrades =
                    allTrades.filter(
                        t => t.date && t.date.includes(ym)
                    );

                const pnl =
                    monthTrades.reduce(
                        (sum, t) =>
                            sum + parseFloat(t.net_pnl || 0),
                        0
                    );

                if (monthTrades.length > 0) {
                    colorClass =
                        pnl >= 0
                            ? 'bg-green'
                            : 'bg-red';
                }
            }

            html += `
                <div class="block ${colorClass}">
                    ${name}
                </div>
            `;
        }

        container.innerHTML = html;
    }

    window.addEventListener('updateDashboard', (e) => {
        window._boxGuard('pnl', () => {

        const trades = e.detail.trades || [];

        // Use server-provided trading date (set by header.html's syncHeader).
        // Falls back to IST wall-clock date if the system fetch hasn't run yet.
        const todayStr =
            window._tradingDate ||
            new Date().toLocaleString('sv-SE', {timeZone:'Asia/Kolkata'}).slice(0, 10);

        const currentMonthStr =
            todayStr.substring(0, 7);

        const dayTrades =
            trades.filter(
                t => t.date === todayStr
            );

        const dayPnL =
            dayTrades.reduce(
                (sum, t) =>
                    sum + parseFloat(t.net_pnl || 0),
                0
            );

        const monthTrades =
            trades.filter(
                t =>
                    t.date &&
                    t.date.startsWith(currentMonthStr)
            );

        const monthPnL =
            monthTrades.reduce(
                (sum, t) =>
                    sum + parseFloat(t.net_pnl || 0),
                0
            );

        const allTimePnL =
            trades.reduce(
                (sum, t) =>
                    sum + parseFloat(t.net_pnl || 0),
                0
            );

        const dayActive =
            dayTrades.filter(
                t => t.status === "ACTIVE"
            ).length;

        const dayClosed =
            dayTrades.filter(
                t => t.status === "CLOSED"
            );

        const dayWins =
            dayClosed.filter(
                t => parseFloat(t.net_pnl) > 0
            ).length;

        const dayWinRate =
            dayClosed.length > 0
                ? Math.round((dayWins/dayClosed.length)*100)
                : 0;

        const monthPnls =
            monthTrades
                .filter(t => t.status === "CLOSED")
                .map(t => parseFloat(t.net_pnl || 0));

        const hwMonth =
            monthPnls.length > 0
                ? Math.max(0, ...monthPnls)
                : 0;

        const hlMonth =
            monthPnls.length > 0
                ? Math.min(0, ...monthPnls)
                : 0;

        const monthWins =
            monthTrades.filter(
                t =>
                    t.status === "CLOSED" &&
                    parseFloat(t.net_pnl) > 0
            ).length;

        const monthClosedCount =
            monthTrades.filter(
                t => t.status === "CLOSED"
            ).length;

        const monthWinRate =
            monthClosedCount > 0
                ? Math.round((monthWins/monthClosedCount)*100)
                : 0;

        const currentCapital =
            STARTING_CAPITAL + allTimePnL;

        const remainingRecovery =
            INITIAL_RECOVERY - allTimePnL;

        const gdTradesNeeded =
            Math.ceil(
                remainingRecovery / TARGET_PER_TRADE
            );

        const dayElem =
            document.getElementById('day-pnl');

        dayElem.innerText =
            `₹${dayPnL.toFixed(2)}`;

        dayElem.className =
            dayPnL >= 0
                ? 'p-main pnl-pos'
                : 'p-main pnl-neg';

        const monElem =
            document.getElementById('mon-pnl');

        monElem.innerText =
            `₹${monthPnL.toFixed(2)}`;

        monElem.className =
            monthPnL >= 0
                ? 'p-main pnl-pos'
                : 'p-main pnl-neg';

        document.getElementById('act').innerText =
            dayActive;

        document.getElementById('tot').innerText =
            dayTrades.length;

        document.getElementById('tot').className =
            dayTrades.length > 3
                ? 'txt-red'
                : '';

        const wrElem =
            document.getElementById('wr');

        wrElem.innerText =
            `${dayWinRate}%`;

        wrElem.className =
            dayWinRate > 50
                ? 'txt-green'
                : 'txt-red';

        const avgWElem =
            document.getElementById('avg-w');

        avgWElem.innerText =
            `${monthWinRate}%`;

        avgWElem.className =
            monthWinRate > 50
                ? 'txt-green'
                : 'txt-red';

        document.getElementById('hw').innerText =
            Math.round(hwMonth);

        document.getElementById('hl').innerText =
            Math.round(Math.abs(hlMonth));

        document.getElementById('cap-val').innerText =
            `${Math.round(currentCapital/1000)}k`;

        document.getElementById('rec-val').innerText =
            `${Math.round(remainingRecovery/1000)}k`;

        document.getElementById('gt').innerText =
            gdTradesNeeded > 0
                ? gdTradesNeeded
                : 0;

        // PnL from emotionally undisciplined trades (entry != Calm OR exit != Disciplined)
        const emoPnL = monthTrades
            .filter(t =>
                t.status === "CLOSED" &&
                (t.entry_emotion !== "Calm" || t.exit_emotion !== "Disciplined")
            )
            .reduce((sum, t) => sum + parseFloat(t.net_pnl || 0), 0);

        const emoPnLElem = document.getElementById('emo-pnl');
        emoPnLElem.innerText = `₹${Math.round(emoPnL)}`;
        emoPnLElem.style.color = emoPnL >= 0 ? '#16a34a' : '#dc2626';

        updateMonthBlocks(trades);

        }); // end _boxGuard
    });

})();
</script>
