<div style="padding:10px 12px;font-family:Lato,sans-serif;font-size:11px;width:100%;height:auto;background:white;border:1px solid #e2e8f0;border-radius:12px;box-sizing:border-box;">

  <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;">OPTIONS OI</div>

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;">

    <div style="text-align:center;padding:6px 4px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;">
      <div style="font-size:10px;color:#94a3b8;margin-bottom:3px;font-weight:700;letter-spacing:0.05em;">MAX PAIN</div>
      <div id="oi-maxpain" style="font-size:12px;font-weight:700;color:#0f172a;">--</div>
      <div id="oi-mp-dist" style="font-size:10px;color:#64748b;margin-top:2px;">--</div>
    </div>

    <div style="text-align:center;padding:6px 4px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;">
      <div style="font-size:10px;color:#94a3b8;margin-bottom:3px;font-weight:700;letter-spacing:0.05em;">CE WALL</div>
      <div id="oi-cewall" style="font-size:12px;font-weight:700;color:#0f172a;">--</div>
      <div id="oi-cetrend" style="font-size:10px;margin-top:2px;">--</div>
    </div>

    <div style="text-align:center;padding:6px 4px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;">
      <div style="font-size:10px;color:#94a3b8;margin-bottom:3px;font-weight:700;letter-spacing:0.05em;">PE WALL</div>
      <div id="oi-pewall" style="font-size:12px;font-weight:700;color:#0f172a;">--</div>
      <div id="oi-petrend" style="font-size:10px;margin-top:2px;">--</div>
    </div>

  </div>

  <div id="oi-fetch" style="font-size:10px;color:#94a3b8;text-align:right;margin-top:6px;">Last: --</div>

</div>

<script>
(function(){
  function oiFmt(n){
    if(n==null)return'--';
    return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function oiRender(d){
    document.getElementById('oi-maxpain').textContent=d.max_pain?oiFmt(d.max_pain):'--';
    document.getElementById('oi-mp-dist').textContent=d.ltp_distance_from_max_pain!=null?Math.round(d.ltp_distance_from_max_pain)+'pts away':'--';
    document.getElementById('oi-cewall').textContent=d.ce_wall?oiFmt(d.ce_wall):'--';
    document.getElementById('oi-pewall').textContent=d.pe_wall?oiFmt(d.pe_wall):'--';

    var ceEl=document.getElementById('oi-cetrend');
    ceEl.textContent=d.ce_trend||'--';
    ceEl.style.color=d.ce_trend==='Building'?'#22c55e':d.ce_trend==='Unwinding'?'#ef4444':'#94a3b8';
    ceEl.style.fontWeight='700';

    var peEl=document.getElementById('oi-petrend');
    peEl.textContent=d.pe_trend||'--';
    peEl.style.color=d.pe_trend==='Building'?'#22c55e':d.pe_trend==='Unwinding'?'#ef4444':'#94a3b8';
    peEl.style.fontWeight='700';

    document.getElementById('oi-fetch').textContent='Last: '+(d.last_fetch||'pending');
  }

  setInterval(function(){
    fetch('/core/oi_snapshot')
      .then(function(r){return r.json();})
      .then(function(d){oiRender(d);})
      .catch(function(){});
  },60000);

  fetch('/core/oi_snapshot')
    .then(function(r){return r.json();})
    .then(function(d){oiRender(d);})
    .catch(function(){});
})();
</script>
