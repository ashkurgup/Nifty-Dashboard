<div
  class="levels-pad"
  style="
    width: 100%;
    height: auto;
    overflow: visible;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px;
    box-sizing: border-box;
    font-family: Lato, sans-serif;
  "
>
  <div
    style="
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    "
  >
    STRUCTURE
  </div>
  <div id="lv-above"></div>
  <div
    id="lv-divider"
    style="display: flex; align-items: center; gap: 6px; margin: 5px 0"
  >
    <div
      style="flex: 1; height: 1px; background: rgba(59, 130, 246, 0.3)"
    ></div>
    <div
      id="lv-ltp"
      style="
        font-size: 9px;
        font-weight: 700;
        color: #3b82f6;
        white-space: nowrap;
      "
    >
      ▶ --
    </div>
    <div
      style="flex: 1; height: 1px; background: rgba(59, 130, 246, 0.3)"
    ></div>
  </div>
  <div id="lv-below"></div>

  <div style="border-top: 1px solid #1e3a5f; margin: 8px 0"></div>

  <div
    style="
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    "
  >
    FVG / IFVG
  </div>
  <div id="lv-fvg"></div>

  <div style="border-top: 1px solid #1e3a5f; margin: 8px 0"></div>

  <div
    style="
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    "
  >
    STATES
  </div>
  <div id="lv-states"></div>
</div>

<script>
  function lvFmt(n) {
    if (n == null) return "--";
    return Number(n).toLocaleString("en-IN", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function lvDots(f, t = 4) {
    let h = '<span style="display:inline-flex;gap:2px;align-items:center;">';
    for (let i = 0; i < t; i++)
      h +=
        '<span style="width:6px;height:6px;border-radius:50%;display:inline-block;background:' +
        (i < f ? "#22c55e" : "#334155") +
        '"></span>';
    return h + "</span>";
  }

  function lvLevelRow(price, type, strength, dist, side) {
    const col = side === "above" ? "#ef4444" : "#22c55e";
    const arrow = side === "above" ? "↑" : "↓";
    return (
      '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;">' +
      '<span style="font-size:11px;font-weight:700;color:#f8fafc;min-width:65px;flex-shrink:0;">' +
      lvFmt(price) +
      "</span>" +
      '<span style="font-size:9px;color:#94a3b8;flex:1;">' +
      type +
      "</span>" +
      lvDots(strength) +
      '<span style="font-size:9px;font-weight:700;color:' +
      col +
      ';min-width:35px;text-align:right;flex-shrink:0;">' +
      arrow +
      dist.toFixed(0) +
      "</span>" +
      "</div>"
    );
  }

  function lvFvgRow(f) {
    const bull = f.type.includes("Bull");
    const col = bull ? "#22c55e" : "#ef4444";
    const arrow = bull ? "↑" : "↓";
    const label =
      f.type.replace("Bull", "").replace("Bear", "").trim() + " " + arrow;
    return (
      '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;">' +
      '<span style="font-size:9px;font-weight:700;color:' +
      col +
      ';min-width:50px;flex-shrink:0;">' +
      label +
      "</span>" +
      '<span style="font-size:9px;color:#94a3b8;flex:1;">' +
      lvFmt(f.bottom) +
      "—" +
      lvFmt(f.top) +
      "</span>" +
      lvDots(f.strength) +
      '<span style="font-size:9px;color:#94a3b8;background:rgba(148,163,184,0.1);padding:1px 4px;border-radius:3px;flex-shrink:0;">D' +
      f.days_old +
      "</span>" +
      "</div>"
    );
  }

  let lvPrevLtp = null;
  let lvSweepMap = {};
  let lvCrossCount = {};

  function lvRender(d) {
    const ltp = d.lp;
    const sr = d.sr_levels || [];
    const fvg = d.fvg_levels || [];

    document.getElementById("lv-ltp").textContent = "▶ " + lvFmt(ltp);

    const above = sr.filter((l) => l.side === "above");
    const below = sr.filter((l) => l.side === "below");

    document.getElementById("lv-above").innerHTML = above.length
      ? above
          .map((l) =>
            lvLevelRow(l.price, l.type, l.strength, l.distance, l.side),
          )
          .join("")
      : "";

    document.getElementById("lv-below").innerHTML = below.length
      ? below
          .map((l) =>
            lvLevelRow(l.price, l.type, l.strength, l.distance, l.side),
          )
          .join("")
      : "";

    document.getElementById("lv-fvg").innerHTML = fvg.length
      ? fvg.map(lvFvgRow).join("")
      : '<div style="font-size:9px;color:#94a3b8;">No FVG nearby</div>';

    const allLevels = [
      ...sr.map((l) => ({ price: l.price, label: l.type })),
      ...fvg.map((f) => ({ price: (f.top + f.bottom) / 2, label: f.type })),
    ];

    let statesHtml = "";
    for (const lv of allLevels) {
      const dist = Math.abs(ltp - lv.price);
      const key = lv.price.toFixed(0);
      if (dist <= 15) {
        statesHtml +=
          '<div style="font-size:10px;color:#f59e0b;padding:2px 0;">→ NEAR &nbsp;' +
          lvFmt(lv.price) +
          " (" +
          lv.label +
          ")</div>";
      }
      if (lvPrevLtp !== null) {
        const crossed =
          (lvPrevLtp < lv.price && ltp > lv.price) ||
          (lvPrevLtp > lv.price && ltp < lv.price);
        if (crossed) {
          lvSweepMap[key] = Date.now();
          lvCrossCount[key] = 0;
        }
      }
      if (lvSweepMap[key]) {
        const age = Date.now() - lvSweepMap[key];
        if (age < 60000) {
          statesHtml +=
            '<div style="font-size:10px;color:#f97316;padding:2px 0;">⚡ SWEEP &nbsp;' +
            lvFmt(lv.price) +
            " (" +
            lv.label +
            ")</div>";
        } else {
          lvCrossCount[key] = (lvCrossCount[key] || 0) + 1;
          if (lvCrossCount[key] >= 3) {
            statesHtml +=
              '<div style="font-size:10px;color:#ef4444;padding:2px 0;">✓ CROSS &nbsp;' +
              lvFmt(lv.price) +
              " (" +
              lv.label +
              ")</div>";
          } else {
            statesHtml +=
              '<div style="font-size:10px;color:#94a3b8;padding:2px 0;">👁 WATCH &nbsp;' +
              lvFmt(lv.price) +
              " (" +
              lv.label +
              ")</div>";
          }
        }
      }
    }

    document.getElementById("lv-states").innerHTML =
      statesHtml ||
      '<div style="font-size:9px;color:#94a3b8;">No active states</div>';
    lvPrevLtp = ltp;
  }

  setInterval(function () {
    fetch("/core/nifty_card")
      .then((r) => r.json())
      .then((d) => lvRender(d))
      .catch(() => {});
  }, 2000);
  fetch("/core/nifty_card")
    .then((r) => r.json())
    .then((d) => lvRender(d))
    .catch(() => {});
</script>
