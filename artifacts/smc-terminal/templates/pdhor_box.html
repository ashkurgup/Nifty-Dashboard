  }
  .ph-wrap .ph-right {

  .ph-wrap .ph-lbl {
    font-size: 10px;

    color: #f8fafc;
  }
  .ph-wrap .ph-price {

  }
  .ph-wrap .ph-mid {

  }

    color: #3b82f6;
  }
  .ph-wrap .ph-sep {
    border-top: 1px solid #1e3a5f;
    margin: 6px 0;
  }
</style>

<div
  class="ph-wrap"
  style="
    width: 100%;
    height: auto;
    overflow: visible;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 10px;
    box-sizing: border-box;
    font-family: Lato, sans-serif;
  "
>
  <div class="ph-row">
    <div class="ph-left">
      <span id="pw-h-dots"></span>
      <div>
        <div class="ph-lbl">PWH</div>
        <div class="ph-price" id="pw-h-price">--</div>
      </div>
      <span id="pw-h-pill"></span>
    </div>
    <div class="ph-mid">
      <div class="ph-pat" id="pw-pat">--</div>
      <div id="pw-stats">--</div>
    </div>
    <div class="ph-right">
      <span id="pw-l-pill"></span>
      <div style="text-align: right">
        <div class="ph-lbl">PWL</div>
        <div class="ph-price" id="pw-l-price">--</div>
      </div>
      <span id="pw-l-dots"></span>
    </div>
  </div>

  <div class="ph-row">
    <div class="ph-left">
      <span id="cw-h-dots"></span>
      <div>
        <div class="ph-lbl">CWH</div>
        <div class="ph-price" id="cw-h-price">--</div>
      </div>
      <span id="cw-h-pill"></span>
    </div>
    <div class="ph-mid">
      <div class="ph-pat" id="cw-pat">--</div>
      <div id="cw-stats">--</div>
    </div>
    <div class="ph-right">
      <span id="cw-l-pill"></span>
      <div style="text-align: right">
        <div class="ph-lbl">CWL</div>
        <div class="ph-price" id="cw-l-price">--</div>
      </div>
      <span id="cw-l-dots"></span>
    </div>
  </div>

  <div class="ph-sep"></div>

  <div class="ph-row">
    <div class="ph-left">
      <span id="pd-h-dots"></span>
      <div>
        <div class="ph-lbl">PDH</div>
        <div class="ph-price" id="pd-h-price">--</div>
      </div>
      <span id="pd-h-pill"></span>
    </div>
    <div class="ph-mid">
      <div class="ph-pat" id="pd-pat">--</div>
      <div id="pd-stats">--</div>
    </div>
    <div class="ph-right">
      <span id="pd-l-pill"></span>
      <div style="text-align: right">
        <div class="ph-lbl">PDL</div>
        <div class="ph-price" id="pd-l-price">--</div>
      </div>
      <span id="pd-l-dots"></span>
    </div>
  </div>

  <div class="ph-sep"></div>

  <div class="ph-row">
    <div class="ph-left">
      <span id="or-h-dots"></span>
      <div>
        <div class="ph-lbl">ORH</div>
        <div class="ph-price" id="or-h-price">--</div>
      </div>
      <span id="or-h-pill"></span>
    </div>
    <div class="ph-mid">
      <div class="ph-pat" id="or-pat">--</div>
      <div id="or-stats">--</div>
    </div>
    <div class="ph-right">
      <span id="or-l-pill"></span>
      <div style="text-align: right">
        <div class="ph-lbl">ORL</div>
        <div class="ph-price" id="or-l-price">--</div>
      </div>
      <span id="or-l-dots"></span>
    </div>
  </div>

  <div class="ph-sep"></div>
  <div
    id="ph-gap-row"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 3px 0;
      font-size: 10px;
    "
  ></div>
</div>

<script>
  function phFmt(n) {
    if (n == null) return "--";
    return Number(n).toLocaleString("en-IN", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function phDots(f, t = 4) {
    let h = '<span style="display:inline-flex;gap:2px;align-items:center;">';
    for (let i = 0; i < t; i++)
      h +=
        '<span style="width:6px;height:6px;border-radius:50%;display:inline-block;background:' +
        (i < f ? "#22c55e" : "#334155") +
        '"></span>';
    return h + "</span>";
  }

  function phPill(arrow, val, color, bg) {
    return (
      '<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;color:' +
      color +
      ";background:" +
      bg +
      ';">' +
      arrow +
      " " +
      val +
      "</span>"
    );
  }

  function getPills(hi, lo, ltp) {
    if (ltp == null || hi == null || lo == null) return { h: "", l: "" };
    const absh = Math.abs(hi - ltp).toFixed(0);
    const absl = Math.abs(lo - ltp).toFixed(0);
    let hp = "",
      lp = "";
    if (ltp >= lo && ltp <= hi) {
      hp = phPill("↑", absh, "#22c55e", "rgba(34,197,94,0.12)");
      lp = phPill("↓", absl, "#ef4444", "rgba(239,68,68,0.12)");
    } else if (ltp > hi) {
      hp = phPill("↓", absh, "#ef4444", "rgba(239,68,68,0.12)");
    } else if (ltp < lo) {
      lp = phPill("↑", absl, "#22c55e", "rgba(34,197,94,0.12)");
    }
    return { h: hp, l: lp };
  }

  function renderRow(ids, hi, lo, pat, bd, bs, hs, ls, ltp) {
    const [hpp, lpp, hd, ld, hp, lp, ps, ss] = ids;
    document.getElementById(hpp).textContent = phFmt(hi);
    document.getElementById(lpp).textContent = phFmt(lo);
    document.getElementById(ps).textContent = pat || "--";
    document.getElementById(ss).textContent =
      bd != null && bs != null ? "BD:" + bd + "% BS:" + bs : "--";
    document.getElementById(hd).innerHTML = phDots(hs);
    document.getElementById(ld).innerHTML = phDots(ls);
    const p = getPills(hi, lo, ltp);
    document.getElementById(hp).innerHTML = p.h;
    document.getElementById(lp).innerHTML = p.l;
  }

  function renderGap(ctx) {
    const el = document.getElementById("ph-gap-row");
    if (!ctx || ctx.gap === "No" || !ctx.gap_val) {
      el.innerHTML = '<span style="color:#94a3b8">No Gap</span>';
      return;
    }
    const sign = ctx.gap_dir === "Bullish" ? "+" : "-";
    const col = ctx.gap_dir === "Bullish" ? "#22c55e" : "#ef4444";
    const status = ctx.gap_closed
      ? "Closed " + (ctx.gap_close_time || "")
      : "Open";
    el.innerHTML =
      '<span style="color:#94a3b8;font-weight:700">Gap</span><span style="color:#334155">|</span><span style="color:' +
      col +
      ';font-weight:700">' +
      sign +
      ctx.gap_val +
      'pts</span><span style="color:#334155">|</span><span style="color:#94a3b8">' +
      status +
      "</span>";
  }

  function renderAll() {
    const ctx = window.phCtx || {};
    const ltp = window.phLtp || null;

    renderRow(
      [
        "pw-h-price",
        "pw-l-price",
        "pw-h-dots",
        "pw-l-dots",
        "pw-h-pill",
        "pw-l-pill",
        "pw-pat",
        "pw-stats",
      ],
      ctx.pw_high,
      ctx.pw_low,
      ctx.pw_pattern,
      ctx.pw_bd,
      ctx.pw_body,
      4,
      4,
      ltp,
    );
    renderRow(
      [
        "cw-h-price",
        "cw-l-price",
        "cw-h-dots",
        "cw-l-dots",
        "cw-h-pill",
        "cw-l-pill",
        "cw-pat",
        "cw-stats",
      ],
      ctx.cw_high,
      ctx.cw_low,
      ctx.cw_pattern,
      ctx.cw_bd,
      ctx.cw_body,
      3,
      4,
      ltp,
    );
    renderRow(
      [
        "pd-h-price",
        "pd-l-price",
        "pd-h-dots",
        "pd-l-dots",
        "pd-h-pill",
        "pd-l-pill",
        "pd-pat",
        "pd-stats",
      ],
      ctx.pdh,
      ctx.pdl,
      ctx.pd_pattern,
      ctx.pd_bd,
      ctx.pd_body,
      3,
      4,
      ltp,
    );

    if (ctx.orh == null) {
      document.getElementById("or-pat").textContent = "Pre-mkt";
      ["or-h-price", "or-l-price"].forEach(
        (id) => (document.getElementById(id).textContent = "--"),
      );
      ["or-h-pill", "or-l-pill"].forEach(
        (id) => (document.getElementById(id).innerHTML = ""),
      );
      document.getElementById("or-stats").textContent = "--";
      document.getElementById("or-h-dots").innerHTML = phDots(4);
      document.getElementById("or-l-dots").innerHTML = phDots(3);
    } else {
      renderRow(
        [
          "or-h-price",
          "or-l-price",
          "or-h-dots",
          "or-l-dots",
          "or-h-pill",
          "or-l-pill",
          "or-pat",
          "or-stats",
        ],
        ctx.orh,
        ctx.orl,
        ctx.or_pattern,
        ctx.or_bd,
        ctx.or_body,
        4,
        3,
        ltp,
      );
    }
    renderGap(ctx);
  }

  setInterval(function () {
    fetch("/core/market_context")
      .then((r) => r.json())
      .then((d) => {
        window.phCtx = d;
        renderAll();
      })
      .catch(() => {});
  }, 300000);
  setInterval(function () {
    fetch("/core/nifty_card")
      .then((r) => r.json())
      .then((d) => {
        window.phLtp = d.lp;
        renderAll();
      })
      .catch(() => {});
  }, 2000);
  fetch("/core/market_context")
    .then((r) => r.json())
    .then((d) => {
      window.phCtx = d;
      renderAll();
    })
    .catch(() => {});
</script>
