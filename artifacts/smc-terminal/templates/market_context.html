<style>
    .mc-wrap {
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
    }

    .mc-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 0 8px;
        background: #f8fafc;
        border-radius: 5px;
        border-left: 3px solid #e2e8f0;
        flex: 1;
        min-height: 0;
    }

    .mc-lbl {
        font-size: 10px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-family: 'Lato', sans-serif;
        width: 26px;
        flex-shrink: 0;
    }

    .mc-sep {
        font-size: 13px;
        font-family: 'Lato', sans-serif;
        color: #cbd5e1;
        font-weight: 300;
        padding: 0 6px;
        flex-shrink: 0;
    }

    /* ── Gap row ── */
    .mc-gap-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
    }

    .mc-gap-pts {
        font-size: 13px;
        font-weight: 800;
        font-family: 'Lato', sans-serif;
        line-height: 1.2;
    }

    .mc-gap-sub {
        font-size: 10px;
        font-weight: 600;
        color: #64748b;
        font-family: 'Lato', sans-serif;
        line-height: 1.2;
    }

    /* ── Pair rows ── */
    .mc-side {
        flex: 1;
        font-size: 12px;
        font-weight: 800;
        font-family: 'Lato', sans-serif;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
    }

    .mc-side-r {
        text-align: right;
    }

    .mc-mid {
        flex: 1.4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        min-width: 0;
        text-align: center;
    }

    .mc-mid-pat {
        font-size: 11px;
        font-weight: 800;
        font-family: 'Lato', sans-serif;
        white-space: nowrap;
        line-height: 1.2;
    }

    .mc-mid-stats {
        font-size: 10px;
        font-weight: 600;
        color: #94a3b8;
        font-family: 'Lato', sans-serif;
        white-space: nowrap;
        line-height: 1.2;
    }

    /* ── Distance badge ── */
    .mc-dist {
        display: inline-block;
        font-size: 10px;
        font-weight: 800;
        font-family: 'Lato', sans-serif;
        margin-left: 3px;
        padding: 1px 4px;
        border-radius: 10px;
        vertical-align: middle;
        white-space: nowrap;
    }

    .mc-dist.sup { background: #dcfce7; color: #15803d; }
    .mc-dist.res { background: #fee2e2; color: #b91c1c; }

    /* ── Colour helpers ── */
    .mc-bull { color: #16a34a; }
    .mc-bear { color: #dc2626; }
    .mc-dim  { color: #94a3b8; }

    .mc-mid-pat.pat-bull   { color: #16a34a; }
    .mc-mid-pat.pat-bear   { color: #dc2626; }
    .mc-mid-pat.pat-s-bull { color: #15803d; }
    .mc-mid-pat.pat-s-bear { color: #b91c1c; }

    /* ── Gap row variants ── */
    .mc-row.gap-bull { border-left-color: #16a34a; background: #f0fdf4; }
    .mc-row.gap-bear { border-left-color: #dc2626; background: #fef2f2; }
    .mc-row.gap-no   { border-left-color: #cbd5e1; }
</style>

<div class="mc-wrap">

    <!-- Gap Row: pts centred, status stacked below -->
    <div class="mc-row gap-no" id="mc-gap-row">
        <span class="mc-lbl">Gap</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-body">
            <div class="mc-gap-pts" id="mc-gap-pts"><span class="mc-dim">--</span></div>
            <div class="mc-gap-sub"  id="mc-gap-status"></div>
        </div>
    </div>

    <!-- PDH / PDL Row -->
    <div class="mc-row">
        <span class="mc-lbl">PD</span>
        <span class="mc-sep">|</span>
        <div class="mc-side"           id="mc-pdh"><span class="mc-dim">--</span></div>
        <span class="mc-sep">|</span>
        <div class="mc-mid"            id="mc-pd-pat"><span class="mc-mid-pat mc-dim">--</span></div>
        <span class="mc-sep">|</span>
        <div class="mc-side mc-side-r" id="mc-pdl"><span class="mc-dim">--</span></div>
    </div>

    <!-- ORH / ORL Row -->
    <div class="mc-row">
        <span class="mc-lbl">OR</span>
        <span class="mc-sep">|</span>
        <div class="mc-side"           id="mc-orh"><span class="mc-dim">--</span></div>
        <span class="mc-sep" id="mc-or-sep">|</span>
        <div class="mc-mid"            id="mc-or-pat"><span class="mc-mid-pat mc-dim">--</span></div>
        <span class="mc-sep">|</span>
        <div class="mc-side mc-side-r" id="mc-orl"><span class="mc-dim">--</span></div>
    </div>

</div>

<script>
(() => {

let _ctx = { pdh: null, pdl: null, orh: null, orl: null, preMarket: false };

// ── Helpers ───────────────────────────────────────────────────────────────

function dist(a, b) { return Math.abs(Math.round(a - b)); }

// Render pattern + BS/BD stats into a .mc-mid cell
function renderPattern(id, label, isBull, body, bd) {
    const el = document.getElementById(id);
    if (!el) return;
    if (!label) {
        el.innerHTML = `<span class="mc-mid-pat mc-dim">--</span>`;
        return;
    }
    const isS = label.startsWith('S ');
    const cls = isS
        ? (isBull === false ? 'pat-s-bear' : 'pat-s-bull')
        : (isBull === false ? 'pat-bear'   : 'pat-bull');

    const stats = (body != null && bd != null)
        ? `<span class="mc-mid-stats">BS: ${body} &nbsp; BD: ${bd}%</span>`
        : (body != null ? `<span class="mc-mid-stats">BS: ${body}</span>` : '');

    el.innerHTML = `<span class="mc-mid-pat ${cls}">${label}</span>${stats}`;
}

// Render a price pair into left (high) and right (low) .mc-side cells
// Left:  price + badge (left-aligned)
// Right: badge + price (right-aligned, mirrored for visual symmetry)
function renderPair(highEl, lowEl, high, low, ltp) {
    if (!high || !low) {
        if (highEl) highEl.innerHTML = `<span class="mc-dim">--</span>`;
        if (lowEl)  lowEl.innerHTML  = `<span class="mc-dim">--</span>`;
        return;
    }
    const h = parseFloat(high), l = parseFloat(low);

    if (ltp > h) {
        // Above both — PDH is support below
        highEl.innerHTML = `<span class="mc-bull">${high}</span><span class="mc-dist sup">↑${dist(ltp,h)}</span>`;
        lowEl.innerHTML  = `<span class="mc-dim">--</span>`;
    } else if (ltp < l) {
        // Below both — PDL is resistance above
        highEl.innerHTML = `<span class="mc-dim">--</span>`;
        lowEl.innerHTML  = `<span class="mc-dist res">↓${dist(ltp,l)}</span><span class="mc-bear"> ${low}</span>`;
    } else {
        // Between — PDH resistance, PDL support
        highEl.innerHTML = `<span class="mc-bull">${high}</span><span class="mc-dist res">↓${dist(ltp,h)}</span>`;
        lowEl.innerHTML  = `<span class="mc-dist sup">↑${dist(ltp,l)}</span><span class="mc-bear"> ${low}</span>`;
    }
}

// ── Distance refresh (every 2 s) ──────────────────────────────────────────

async function refreshDistances() {
    try {
        const res = await fetch('/core/nifty_card');
        const j   = await res.json();
        const ltp = parseFloat(j.lp || j.ltp || 0);
        if (!ltp) return;

        renderPair(
            document.getElementById('mc-pdh'),
            document.getElementById('mc-pdl'),
            _ctx.pdh, _ctx.pdl, ltp
        );

        if (!_ctx.preMarket) {
            renderPair(
                document.getElementById('mc-orh'),
                document.getElementById('mc-orl'),
                _ctx.orh, _ctx.orl, ltp
            );
        }
    } catch (e) {
        console.error('[MktCtx dist]', e);
    }
}

// ── Context fetch (every 5 min) ───────────────────────────────────────────

async function loadCtx() {
    try {
        const res = await fetch('/core/market_context');
        const d   = await res.json();
        if (!d) return;

        // ── Gap ───────────────────────────────────────────────
        const gapPts    = document.getElementById('mc-gap-pts');
        const gapStatus = document.getElementById('mc-gap-status');
        const gapRow    = document.getElementById('mc-gap-row');
        if (gapPts && gapRow) {
            if (!d.gap || d.gap === 'No') {
                gapPts.innerHTML    = `<span class="mc-dim">No Gap</span>`;
                gapStatus.innerHTML = '';
                gapRow.className    = 'mc-row gap-no';
            } else {
                const isBull = d.gap_dir === 'Bullish';
                const sign   = isBull ? '+' : '';
                const pts    = d.gap_val !== null ? `${sign}${d.gap_val} pts` : '';
                const status = d.gap_closed === true ? `Close - ${d.gap_close_time}` : 'Open';
                const cls    = isBull ? 'mc-bull' : 'mc-bear';
                gapPts.innerHTML    = `<span class="${cls}">${pts}</span>`;
                gapStatus.innerHTML = status;
                gapRow.className    = `mc-row ${isBull ? 'gap-bull' : 'gap-bear'}`;
            }
        }

        // ── PDH / PDL + pattern ───────────────────────────────
        _ctx.pdh = d.pdh || null;
        _ctx.pdl = d.pdl || null;
        renderPattern('mc-pd-pat', d.pd_pattern, d.pd_bull, d.pd_body, d.pd_bd);

        // ── ORH / ORL + pattern ───────────────────────────────
        _ctx.orh       = d.orh || null;
        _ctx.orl       = d.orl || null;
        _ctx.preMarket = !(d.orh && d.orl);
        const orSepEl  = document.getElementById('mc-or-sep');
        if (_ctx.preMarket) {
            document.getElementById('mc-orh').innerHTML = `<span class="mc-dim">Pre-mkt</span>`;
            document.getElementById('mc-orl').innerHTML = '';
            if (orSepEl) orSepEl.style.visibility = 'hidden';
            renderPattern('mc-or-pat', null, null, null, null);
        } else {
            if (orSepEl) orSepEl.style.visibility = '';
            renderPattern('mc-or-pat', d.or_pattern, d.or_bull, d.or_body, d.or_bd);
        }

        // Trigger immediate distance render after ctx loads
        refreshDistances();

    } catch (e) {
        console.error('[MktCtx]', e);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadCtx();
    setInterval(loadCtx, 300000);        // context: every 5 min
    setInterval(refreshDistances, 2000); // distances: every 2 s
});

})();
</script>
