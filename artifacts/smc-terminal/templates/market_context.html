<style>
    .mc-wrap {
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
    }

    .mc-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 0 10px;
        background: #f8fafc;
        border-radius: 5px;
        border-left: 3px solid #e2e8f0;
        flex: 1;
        min-height: 0;
        gap: 0;
    }

    .mc-row-label {
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-family: 'Lato', sans-serif;
        width: 72px;
        flex-shrink: 0;
    }

    .mc-sep {
        font-size: 13px;
        font-family: 'Lato', sans-serif;
        color: #cbd5e1;
        font-weight: 300;
        padding: 0 8px;
        flex-shrink: 0;
    }

    .mc-row-val {
        font-size: 13px;
        font-weight: 800;
        color: #0f172a;
        font-family: 'Lato', sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        text-align: center;
    }

    /* Gap row: pts centred, status pinned to far right */
    .mc-gap-inner {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
    }

    .mc-gap-pts {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 800;
        font-family: 'Lato', sans-serif;
    }

    .mc-gap-status {
        font-size: 13px;
        font-weight: 800;
        color: #64748b;
        font-family: 'Lato', sans-serif;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .mc-bull { color: #16a34a; }
    .mc-bear { color: #dc2626; }
    .mc-dim  { color: #94a3b8; }

    .mc-row.gap-bull { border-left-color: #16a34a; background: #f0fdf4; }
    .mc-row.gap-bear { border-left-color: #dc2626; background: #fef2f2; }
    .mc-row.gap-no   { border-left-color: #cbd5e1; }
</style>

<div class="mc-wrap">

    <div class="mc-row" id="mc-gap-row">
        <span class="mc-row-label">Gap</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-inner">
            <span class="mc-gap-pts" id="mc-gap-pts"><span class="mc-dim">--</span></span>
            <span class="mc-sep" id="mc-gap-sep2" style="display:none">|</span>
            <span class="mc-gap-status" id="mc-gap-status"></span>
        </div>
    </div>

    <div class="mc-row">
        <span class="mc-row-label">PDH / PDL</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-inner">
            <span class="mc-gap-pts mc-bull" id="mc-pdh">--</span>
            <span class="mc-sep">|</span>
            <span class="mc-gap-status mc-bear" id="mc-pdl">--</span>
        </div>
    </div>

    <div class="mc-row">
        <span class="mc-row-label">ORH / ORL</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-inner">
            <span class="mc-gap-pts mc-bull" id="mc-orh">--</span>
            <span class="mc-sep" id="mc-or-sep">|</span>
            <span class="mc-gap-status mc-bear" id="mc-orl">--</span>
        </div>
    </div>
</div>

<script>
(() => {

async function loadCtx() {
    try {
        const res = await fetch('/core/market_context');
        const d   = await res.json();
        if (!d) return;

        // ── Gap ───────────────────────────────────────────────
        const gapPts    = document.getElementById('mc-gap-pts');
        const gapStatus = document.getElementById('mc-gap-status');
        const gapSep2   = document.getElementById('mc-gap-sep2');
        const gapRow    = document.getElementById('mc-gap-row');
        if (gapPts && gapRow) {
            if (!d.gap || d.gap === 'No') {
                gapPts.innerHTML    = `<span class="mc-dim">No Gap</span>`;
                gapStatus.innerHTML = '';
                gapSep2.style.display = 'none';
                gapRow.className    = 'mc-row gap-no';
            } else {
                const isBull = d.gap_dir === 'Bullish';
                const sign   = isBull ? '+' : '';
                const pts    = d.gap_val !== null ? `${sign}${d.gap_val} pts` : '';
                const status = d.gap_closed === true
                    ? `Cl - ${d.gap_close_time}`
                    : 'Open';
                const cls    = isBull ? 'mc-bull' : 'mc-bear';
                gapPts.innerHTML    = `<span class="${cls}">${pts}</span>`;
                gapStatus.textContent = status;
                gapSep2.style.display = '';
                gapRow.className    = `mc-row ${isBull ? 'gap-bull' : 'gap-bear'}`;
            }
        }

        // ── PDH / PDL ─────────────────────────────────────────
        const pdhEl = document.getElementById('mc-pdh');
        const pdlEl = document.getElementById('mc-pdl');
        if (pdhEl && pdlEl) {
            pdhEl.textContent = d.pdh || '--';
            pdlEl.textContent = d.pdl || '--';
        }

        // ── ORH / ORL ─────────────────────────────────────────
        const orhEl   = document.getElementById('mc-orh');
        const orlEl   = document.getElementById('mc-orl');
        const orSepEl = document.getElementById('mc-or-sep');
        if (orhEl && orlEl) {
            if (d.orh && d.orl) {
                orhEl.textContent = d.orh;
                orlEl.textContent = d.orl;
                if (orSepEl) orSepEl.style.display = '';
            } else {
                orhEl.textContent = 'Pre-market';
                orlEl.textContent = '';
                if (orSepEl) orSepEl.style.display = 'none';
            }
        }

    } catch (e) {
        console.error('[MktCtx]', e);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadCtx();
    setInterval(loadCtx, 300000);   // refresh every 5 min
});

})();
</script>
