<style>
    .mc-wrap {
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
    }

    .mc-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 0 10px;
        background: #f8fafc;
        border-radius: 5px;
        border-left: 3px solid #e2e8f0;
        flex: 1;
        min-height: 0;
        gap: 0;
    }

    .mc-row-label {
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-family: 'Lato', sans-serif;
        width: 72px;
        flex-shrink: 0;
    }

    .mc-sep {
        font-size: 13px;
        font-family: 'Lato', sans-serif;
        color: #cbd5e1;
        font-weight: 300;
        padding: 0 8px;
        flex-shrink: 0;
    }

    .mc-row-val {
        font-size: 13px;
        font-weight: 800;
        color: #0f172a;
        font-family: 'Lato', sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        text-align: center;
    }

    /* Gap row: pts centred, status pinned to far right */
    .mc-gap-inner {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
    }

    .mc-gap-pts {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 800;
        font-family: 'Lato', sans-serif;
    }

    .mc-gap-status {
        font-size: 13px;
        font-weight: 800;
        color: #64748b;
        font-family: 'Lato', sans-serif;
        white-space: nowrap;
        flex: 1;
        text-align: center;
    }

    /* Equal-split inner row (PDH/PDL, ORH/ORL) */
    .mc-gap-inner.mc-split .mc-gap-pts,
    .mc-gap-inner.mc-split .mc-gap-status {
        flex: 1;
        text-align: center;
        flex-shrink: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .mc-dist {
        font-size: 11px;
        font-weight: 700;
        font-family: 'Lato', sans-serif;
        margin-left: 3px;
    }

    .mc-dist.sup { color: #16a34a; }
    .mc-dist.res { color: #dc2626; }

    .mc-bull { color: #16a34a; }
    .mc-bear { color: #dc2626; }
    .mc-dim  { color: #94a3b8; }

    .mc-row.gap-bull { border-left-color: #16a34a; background: #f0fdf4; }
    .mc-row.gap-bear { border-left-color: #dc2626; background: #fef2f2; }
    .mc-row.gap-no   { border-left-color: #cbd5e1; }
</style>

<div class="mc-wrap">

    <div class="mc-row" id="mc-gap-row">
        <span class="mc-row-label">Gap</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-inner">
            <span class="mc-gap-pts" id="mc-gap-pts"><span class="mc-dim">--</span></span>
            <span class="mc-sep" id="mc-gap-sep2" style="display:none">|</span>
            <span class="mc-gap-status" id="mc-gap-status"></span>
        </div>
    </div>

    <div class="mc-row">
        <span class="mc-row-label">PDH / PDL</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-inner mc-split">
            <span class="mc-gap-pts" id="mc-pdh"><span class="mc-dim">--</span></span>
            <span class="mc-sep">|</span>
            <span class="mc-gap-status" id="mc-pdl"><span class="mc-dim">--</span></span>
        </div>
    </div>

    <div class="mc-row">
        <span class="mc-row-label">ORH / ORL</span>
        <span class="mc-sep">|</span>
        <div class="mc-gap-inner mc-split">
            <span class="mc-gap-pts" id="mc-orh"><span class="mc-dim">--</span></span>
            <span class="mc-sep" id="mc-or-sep">|</span>
            <span class="mc-gap-status" id="mc-orl"><span class="mc-dim">--</span></span>
        </div>
    </div>
</div>

<script>
(() => {

// Stored context levels — updated every 5 min
let _ctx = { pdh: null, pdl: null, orh: null, orl: null, preMarket: false };

// ── Helpers ───────────────────────────────────────────────────────────────

function dist(a, b) { return Math.abs(Math.round(a - b)); }

// Returns HTML for one side of a level pair.
// high = true → this is the upper level (PDH or ORH)
// high = false → this is the lower level (PDL or ORL)
function levelHtml(level, ltp, isHigh, colorCls) {
    if (!level) return `<span class="mc-dim">--</span>`;
    const val = parseFloat(level);
    const d   = dist(ltp, val);

    let badge = '';
    if (isHigh) {
        // Upper level
        if (ltp > val) {
            // price broke above → ↑ green
            badge = `<span class="mc-dist sup">↑${d}</span>`;
        } else {
            // price is below → level is overhead resistance → ↓ red
            badge = `<span class="mc-dist res">↓${d}</span>`;
        }
    } else {
        // Lower level
        if (ltp < val) {
            // price broke below → ↓ red
            badge = `<span class="mc-dist res">↓${d}</span>`;
        } else if (ltp <= parseFloat(_ctx[isHigh ? 'pdh' : 'orh'] || ltp) ) {
            // price is above → support below → ↑ green
            badge = `<span class="mc-dist sup">↑${d}</span>`;
        } else {
            // price above both levels → lower level is irrelevant
            badge = '';
        }
    }
    return `<span class="${colorCls}">${level}</span>${badge}`;
}

// Simplified pair renderer using explicit price-zone logic
function renderPair(highEl, lowEl, high, low, ltp) {
    if (!high || !low) {
        if (highEl) highEl.innerHTML = `<span class="mc-dim">--</span>`;
        if (lowEl)  lowEl.innerHTML  = `<span class="mc-dim">--</span>`;
        return;
    }
    const h = parseFloat(high), l = parseFloat(low);

    if (ltp > h) {
        // Price above both — upper gets ↑ green, lower empty
        highEl.innerHTML = `<span class="mc-bull">${high}</span><span class="mc-dist sup">↑${dist(ltp,h)}</span>`;
        lowEl.innerHTML  = `<span class="mc-dim">--</span>`;
    } else if (ltp < l) {
        // Price below both — upper empty, lower gets ↓ red
        highEl.innerHTML = `<span class="mc-dim">--</span>`;
        lowEl.innerHTML  = `<span class="mc-bear">${low}</span><span class="mc-dist res">↓${dist(ltp,l)}</span>`;
    } else {
        // Price between — upper is resistance (↓ red), lower is support (↑ green)
        highEl.innerHTML = `<span class="mc-bull">${high}</span><span class="mc-dist res">↓${dist(ltp,h)}</span>`;
        lowEl.innerHTML  = `<span class="mc-bear">${low}</span><span class="mc-dist sup">↑${dist(ltp,l)}</span>`;
    }
}

// ── Distance refresh (every 2 s) ──────────────────────────────────────────

async function refreshDistances() {
    try {
        const res = await fetch('/core/nifty_card');
        const j   = await res.json();
        const ltp = parseFloat(j.lp || j.ltp || 0);
        if (!ltp) return;

        renderPair(
            document.getElementById('mc-pdh'),
            document.getElementById('mc-pdl'),
            _ctx.pdh, _ctx.pdl, ltp
        );

        const orSepEl = document.getElementById('mc-or-sep');
        if (_ctx.preMarket) {
            document.getElementById('mc-orh').innerHTML = `<span class="mc-dim">Pre-market</span>`;
            document.getElementById('mc-orl').innerHTML = '';
            if (orSepEl) orSepEl.style.display = 'none';
        } else {
            if (orSepEl) orSepEl.style.display = '';
            renderPair(
                document.getElementById('mc-orh'),
                document.getElementById('mc-orl'),
                _ctx.orh, _ctx.orl, ltp
            );
        }
    } catch (e) {
        console.error('[MktCtx dist]', e);
    }
}

// ── Context fetch (every 5 min) ───────────────────────────────────────────

async function loadCtx() {
    try {
        const res = await fetch('/core/market_context');
        const d   = await res.json();
        if (!d) return;

        // Store levels for distance calc
        _ctx.pdh       = d.pdh  || null;
        _ctx.pdl       = d.pdl  || null;
        _ctx.orh       = d.orh  || null;
        _ctx.orl       = d.orl  || null;
        _ctx.preMarket = !(d.orh && d.orl);

        // ── Gap ───────────────────────────────────────────────
        const gapPts    = document.getElementById('mc-gap-pts');
        const gapStatus = document.getElementById('mc-gap-status');
        const gapSep2   = document.getElementById('mc-gap-sep2');
        const gapRow    = document.getElementById('mc-gap-row');
        if (gapPts && gapRow) {
            if (!d.gap || d.gap === 'No') {
                gapPts.innerHTML      = `<span class="mc-dim">No Gap</span>`;
                gapStatus.innerHTML   = '';
                gapSep2.style.display = 'none';
                gapRow.className      = 'mc-row gap-no';
            } else {
                const isBull = d.gap_dir === 'Bullish';
                const sign   = isBull ? '+' : '';
                const pts    = d.gap_val !== null ? `${sign}${d.gap_val} pts` : '';
                const status = d.gap_closed === true ? `Cl - ${d.gap_close_time}` : 'Open';
                const cls    = isBull ? 'mc-bull' : 'mc-bear';
                gapPts.innerHTML      = `<span class="${cls}">${pts}</span>`;
                gapStatus.textContent = status;
                gapSep2.style.display = '';
                gapRow.className      = `mc-row ${isBull ? 'gap-bull' : 'gap-bear'}`;
            }
        }

        // Trigger immediate distance render after ctx loads
        refreshDistances();

    } catch (e) {
        console.error('[MktCtx]', e);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadCtx();
    setInterval(loadCtx, 300000);        // context: every 5 min
    setInterval(refreshDistances, 2000); // distances: every 2 s
});

})();
</script>
